<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#05090d">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<title>Jarvis</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{display:flex;flex-direction:column;height:100dvh;background:radial-gradient(circle at 50% 12%,#0b2233,#05090d 70%);color:#bfefff;font-family:sans-serif}
#top{text-align:center;padding:14px 0 6px}
#core{width:110px;height:110px;margin:0 auto;border-radius:50%;border:3px solid #35d4ff;box-shadow:0 0 25px #35d4ff,inset 0 0 25px #35d4ff;position:relative;animation:pulse 3s ease-in-out infinite}
#core:before{content:"";position:absolute;top:18px;left:18px;right:18px;bottom:18px;border-radius:50%;border:2px dashed #7be6ff;animation:spin 8s linear infinite}
#core:after{content:"";position:absolute;top:42px;left:42px;right:42px;bottom:42px;border-radius:50%;background:#aef1ff;box-shadow:0 0 25px #aef1ff}
#core.parla{animation:pulse .5s ease-in-out infinite}
#core.ascolta{border-color:#7dffb0;box-shadow:0 0 30px #7dffb0,inset 0 0 25px #7dffb0}
@keyframes pulse{50%{transform:scale(1.07);box-shadow:0 0 45px #35d4ff,inset 0 0 35px #35d4ff}}
@keyframes spin{to{transform:rotate(360deg)}}
#nome{letter-spacing:6px;font-size:14px;margin-top:10px;color:#7be6ff}
#stato{font-size:13px;margin-top:4px;color:#7fb7c9;min-height:18px}
#chat{flex:1;overflow-y:auto;padding:10px 14px}
.m{margin:8px 0;padding:10px 12px;border-radius:10px;white-space:pre-wrap;line-height:1.4}
.u{background:#123a5a;margin-left:36px;border:1px solid #1f6a9a}
.j{background:rgba(20,50,70,.7);margin-right:36px;border:1px solid #1a5570}
#barra{display:flex;gap:8px;padding:6px 8px 0;background:#04080c}
form{display:flex;gap:8px;padding:8px;background:#04080c;padding-bottom:calc(8px + env(safe-area-inset-bottom))}
input,select{padding:12px;font-size:16px;border-radius:8px;border:1px solid #1f6a9a;background:#0a1a26;color:#dff;min-width:0}
#t{flex:1}
button{padding:12px 14px;font-size:16px;border:0;border-radius:8px;background:#2a9df4;color:#fff}
.s{background:#0a1a26;border:1px solid #1f6a9a}
.attivo{background:#1f8a5a}
#imp{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(2,6,10,.96);padding:20px;overflow-y:auto}
#imp label{display:block;margin:14px 0 4px;font-size:14px;color:#7be6ff}
#imp input,#imp select{width:100%}
#imp .rig{display:flex;gap:8px;margin-top:20px}
#imp p{font-size:13px;color:#7fb7c9;line-height:1.4}
</style>
</head>
<body>
<div id="top">
  <div id="core"></div>
  <div id="nome">J.A.R.V.I.S.</div>
  <div id="stato">Pronto</div>
</div>
<div id="chat"></div>
<div id="barra">
  <button type="button" class="s" id="bImp" title="Impostazioni">⚙</button>
  <button type="button" class="s" id="bVoce" title="Voce on/off">🔊</button>
  <button type="button" class="s" id="bAscolto" title="Ascolto Ehi Jarvis">👂 Ehi Jarvis</button>
</div>
<form id="f">
  <button type="button" class="s" id="bMic">🎤</button>
  <input id="t" autocomplete="off" enterkeyhint="send" placeholder="Scrivi o parla a Jarvis...">
  <button>Invia</button>
</form>

<div id="imp">
  <h2>Impostazioni</h2>
  <p>Questi dati restano solo su questo telefono. Non vengono salvati nel sito.</p>
  <label for="iUrl">URL dell'applicazione web (Apps Script)</label>
  <input id="iUrl" type="url" placeholder="https://script.google.com/macros/s/.../exec" autocomplete="off">
  <label for="iPw">Password di Jarvis</label>
  <input id="iPw" type="password" autocomplete="off">
  <label for="iVoce">Voce</label>
  <select id="iVoce"></select>
  <div class="rig">
    <button type="button" id="bSalva">Salva</button>
    <button type="button" class="s" id="bChiudi">Chiudi</button>
  </div>
</div>

<script>
(function(){
var $=function(i){return document.getElementById(i);};
var cfg={url:'',pw:''};
try{cfg.url=localStorage.getItem('j_url')||'';cfg.pw=localStorage.getItem('j_pw')||'';}catch(e){}

var voceOn=true, voci=[], parlando=false, modoAscolto=false, inAttesa=false, rec=null, wl=null;
var SR=window.SpeechRecognition||window.webkitSpeechRecognition;

function setStato(t){$('stato').textContent=t;}
function add(c,t){
  var d=document.createElement('div');
  d.className='m '+c;d.textContent=t;
  var ch=$('chat');ch.appendChild(d);ch.scrollTop=ch.scrollHeight;
  return d;
}

/* ---------- Voce (sintesi) ---------- */
function caricaVoci(){
  voci=speechSynthesis.getVoices().filter(function(v){return v.lang&&v.lang.toLowerCase().indexOf('it')===0;});
  var s=$('iVoce');s.innerHTML='';
  var salvata='';
  try{salvata=localStorage.getItem('j_voce')||'';}catch(e){}
  voci.forEach(function(v,i){
    var o=document.createElement('option');
    o.value=v.name;o.textContent='Voce '+(i+1)+' - '+v.name;
    if(v.name===salvata)o.selected=true;
    s.appendChild(o);
  });
}
if('speechSynthesis' in window){caricaVoci();speechSynthesis.onvoiceschanged=caricaVoci;}
function vocePreferita(){
  var nome=$('iVoce').value;
  return voci.filter(function(v){return v.name===nome;})[0]||voci[0]||null;
}
function parla(t){
  if(!voceOn||!('speechSynthesis' in window))return;
  speechSynthesis.cancel();
  if(modoAscolto)fermaRec();
  var u=new SpeechSynthesisUtterance(String(t).replace(/[*_#]/g,''));
  var v=vocePreferita();if(v)u.voice=v;
  u.lang='it-IT';u.pitch=1;u.rate=1.1;
  var fine=function(){
    parlando=false;$('core').className=modoAscolto?'ascolta':'';
    if(modoAscolto)avviaRec(true);
  };
  u.onstart=function(){parlando=true;$('core').className='parla';};
  u.onend=fine;u.onerror=fine;
  speechSynthesis.speak(u);
}

/* ---------- Chiamata a Jarvis ---------- */
async function chiedi(q){
  var r=await fetch(cfg.url,{method:'POST',body:JSON.stringify({password:cfg.pw,domanda:q})});
  var j=await r.json();
  if(!j.ok)throw new Error(j.errore||'Errore sconosciuto');
  return j.risposta;
}
async function invia(q){
  q=(q||'').trim();if(!q)return;
  if(!cfg.url||!cfg.pw){apriImp();return;}
  add('u',q);
  var w=add('j','...');
  setStato('Penso...');
  try{
    var r=await chiedi(q);
    w.textContent=r;parla(r);
  }catch(e){
    w.textContent='Errore: '+e.message;
  }
  setStato(modoAscolto?'In ascolto: di\' "Ehi Jarvis"':'Pronto');
}

/* ---------- Riconoscimento vocale ---------- */
function fermaRec(){
  if(rec){var r=rec;rec=null;r.onend=null;r.onerror=null;try{r.abort();}catch(e){}}
}
function gestisciAscolto(t){
  var m=t.match(/(?:j|g|gi)arvis/i);
  if(m){
    var cmd=t.slice(m.index+m[0].length).replace(/^[\s,.:!?]+/,'').trim();
    if(cmd){inAttesa=false;invia(cmd);}
    else{inAttesa=true;parla('Dimmi.');}
  }else if(inAttesa){
    inAttesa=false;invia(t);
  }
}
function avviaRec(continuo){
  if(!SR){alert('Questo browser non supporta il riconoscimento vocale. Usa Chrome.');return;}
  fermaRec();
  var r=new SR();
  rec=r;
  r.lang='it-IT';r.continuous=continuo;r.interimResults=false;
  r.onresult=function(ev){
    var t=ev.results[ev.results.length-1][0].transcript.trim();
    if(!t)return;
    if(continuo)gestisciAscolto(t);else invia(t);
  };
  r.onerror=function(ev){
    if(ev.error==='not-allowed'||ev.error==='service-not-allowed'){
      modoAscolto=false;aggiornaAscolto();setStato('Microfono non consentito');
    }
  };
  r.onend=function(){
    if(rec!==r)return;
    if(continuo&&modoAscolto&&!parlando){
      setTimeout(function(){if(modoAscolto&&!parlando)avviaRec(true);},300);
    }else if(!continuo){
      setStato(modoAscolto?'In ascolto: di\' "Ehi Jarvis"':'Pronto');
    }
  };
  try{
    r.start();
    setStato(continuo?'In ascolto: di\' "Ehi Jarvis"':'Ti ascolto...');
  }catch(e){}
}
async function schermoAcceso(on){
  try{
    if(on&&navigator.wakeLock){wl=await navigator.wakeLock.request('screen');}
    else if(wl){await wl.release();wl=null;}
  }catch(e){}
}
document.addEventListener('visibilitychange',function(){
  if(document.visibilityState==='visible'&&modoAscolto)schermoAcceso(true);
});
function aggiornaAscolto(){
  $('bAscolto').className=modoAscolto?'attivo':'s';
  $('core').className=modoAscolto&&!parlando?'ascolta':$('core').className;
  if(!modoAscolto&&!parlando)$('core').className='';
}

/* ---------- Impostazioni ---------- */
function apriImp(){
  $('iUrl').value=cfg.url;$('iPw').value=cfg.pw;
  $('imp').style.display='block';
}

/* ---------- Eventi ---------- */
$('f').addEventListener('submit',function(e){
  e.preventDefault();
  var i=$('t');var q=i.value;i.value='';invia(q);
});
$('bMic').addEventListener('click',function(){
  if(modoAscolto){modoAscolto=false;aggiornaAscolto();schermoAcceso(false);}
  avviaRec(false);
});
$('bVoce').addEventListener('click',function(){
  voceOn=!voceOn;
  $('bVoce').textContent=voceOn?'🔊':'🔇';
  if(!voceOn&&'speechSynthesis' in window)speechSynthesis.cancel();
  else parla('Voce attiva.');
});
$('bAscolto').addEventListener('click',function(){
  modoAscolto=!modoAscolto;
  aggiornaAscolto();
  if(modoAscolto){
    schermoAcceso(true);
    avviaRec(true);
    parla('Ascolto attivo. Chiamami quando vuoi.');
  }else{
    fermaRec();schermoAcceso(false);setStato('Pronto');
  }
});
$('bImp').addEventListener('click',apriImp);
$('bChiudi').addEventListener('click',function(){$('imp').style.display='none';});
$('bSalva').addEventListener('click',function(){
  cfg.url=$('iUrl').value.trim();cfg.pw=$('iPw').value;
  try{
    localStorage.setItem('j_url',cfg.url);
    localStorage.setItem('j_pw',cfg.pw);
    localStorage.setItem('j_voce',$('iVoce').value);
  }catch(e){}
  $('imp').style.display='none';
  parla('Impostazioni salvate.');
});

add('j','Eccomi! Sistemi online. Che si fa oggi?');
if(!cfg.url||!cfg.pw)apriImp();

if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js').catch(function(){});
}
})();
</script>
</body>
</html>
